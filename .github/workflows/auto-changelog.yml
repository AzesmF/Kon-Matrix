name: Auto Changelog on Release

on:
  release:
    types: [published]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run auto-changelog script
        run: python3 tools/auto-changelog.py
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "docs: auto-update CHANGELOG and SHA256SUMS for ${{ github.event.release.tag_name }}"
          title: "🤖 Auto Changelog: ${{ github.event.release.tag_name }}"
          body: |
            Автоматическое обновление артефактов для релиза ${{ github.event.release.tag_name }}.
            
            **Изменения:**
            - Обновлён `CHANGELOG.md`
            - Пересчитаны `SHA256SUMS`
            
            **Проверка:**
            - [x] CI/CD проверка (Kon-Matrix L1 Verification) должна пройти успешно.
            - [ ] Требуется ручное одобрение и merge для соблюдения INT-L3.
          branch: auto/changelog-${{ github.event.release.tag_name }}
          base: master
          labels: automated,changelog
          reviewers: AzesmF
          delete-branch: true
