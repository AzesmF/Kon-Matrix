name: PUR-L3 DAST Scan (OWASP ZAP)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v1
        with:
          target: 'https://azesmf.github.io/Kon-Matrix/'
          format: 'html'
          artifact_name: 'zap-baseline-report'
          fail_action: false
          cmd_options: '-a'

      - name: Upload ZAP Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'zap_baseline_report.sarif'
