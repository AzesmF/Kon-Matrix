name: Audit Log Recording

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Record to WORM Log
        run: |
          mkdir -p audit-logs
          python3 tools/worm-logger.py append \
            --event "release.published" \
            --detail '{"tag": "${{ github.event.release.tag_name }}", "actor": "${{ github.actor }}"}' \
            --actor "github-actions"
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore: append to WORM audit log for ${{ github.event.release.tag_name }}"
          title: " Auto Audit Log: ${{ github.event.release.tag_name }}"
          body: |
            Автоматическая запись события релиза в WORM audit log.
            
            **Изменения:**
            - Обновлён `audit-logs/worm-chain.jsonl`
            
            **Проверка:**
            - [x] Целостность цепочки хешей сохранена
            - [ ] Требуется ручное одобрение и merge
          branch: auto/audit-log-${{ github.event.release.tag_name }}
          base: master
          labels: automated,audit
          reviewers: AzesmF
          delete-branch: true
