name: Audit Log Recording

on:
  push:
    branches: [master]
  release:
    types: [published]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Record to WORM Log
        run: |
          mkdir -p audit-logs
          python3 tools/worm-logger.py append \
            --event "ci.triggered" \
            --detail '{"ref": "${{ github.ref }}", "actor": "${{ github.actor }}"}' \
            --actor "github-actions"
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore: append to WORM audit log"
          title: "🤖 Auto Audit Log Update"
          body: |
            Автоматическая запись событий в WORM audit log.
            
            **Изменения:**
            - Обновлён `audit-logs/worm-chain.jsonl`
            
            **Проверка:**
            - [x] Целостность цепочки хешей сохранена
            - [ ] Требуется ручное одобрение и merge
          branch: auto/audit-log
          base: master
          labels: automated,audit
          reviewers: AzesmF
          delete-branch: true
