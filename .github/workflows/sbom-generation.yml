name: SBOM Generation

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'requirements*.txt'
  workflow_dispatch:

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          # Заглушка: в реальности здесь вызов cyclonedx-python
          echo '{"bomFormat": "CycloneDX", "specVersion": "1.4", "version": 1, "components": []}' > sbom/sbom.cyclonedx.json
      - name: Commit SBOM
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sbom/sbom.cyclonedx.json
          git commit -m "chore: auto-generate SBOM" || echo "No changes"
          git push
