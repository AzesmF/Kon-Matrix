name: SBOM Generation

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'requirements*.txt'
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          python3 tools/generate-sbom.py
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore: auto-generate SBOM (CycloneDX)"
          title: " Auto SBOM Generation"
          body: |
            Автоматическая генерация SBOM (Software Bill of Materials) в формате CycloneDX.
            
            **Изменения:**
            - Обновлён `sbom/sbom.cyclonedx.json`
            
            **Проверка:**
            - [x] SBOM соответствует формату CycloneDX 1.4
            - [ ] Требуется ручное одобрение и merge
          branch: auto/sbom-generation
          base: master
          labels: automated,sbom
          reviewers: AzesmF
          delete-branch: true
